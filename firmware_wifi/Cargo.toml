[package]
name = "ultrasonic-weather-station-wifi"
version = "0.1.0"
edition = "2021"
authors = ["wifi-meteo"]
resolver = "2"

[features]
default = []
# Continuous mains-powered operation, without ESP32 deep sleep.
mains-powered = []

[dependencies]
anyhow = "1"
embedded-svc = "0.28"
embedded-hal = "1"
esp-idf-hal = "0.45"
esp-idf-svc = "0.51"
esp-idf-sys = { version = "0.36", features = ["binstart"] }
log = "0.4"

[build-dependencies]
embuild = "0.33"
